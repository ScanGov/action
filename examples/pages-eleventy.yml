# An Eleventy site built in CI and deployed to GitHub Pages.
# Swap the build command and output directory for Astro, Hugo, Jekyll, etc.

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx @11ty/eleventy
      - uses: ScanGov/action@v1.0.1
        with:
          site-dir: _site
          canonical-domain: www.example.gov
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
